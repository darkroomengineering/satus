# Stable patch/minor bumps that pass CI can be auto-merged by
# .github/workflows/automerge-dependabot.yml. Major, 0.x, prerelease and
# unrecognized updates stay open for human review.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    # A freshly published action release gets a few days for compromise
    # reports to surface before a PR proposes it.
    cooldown:
      default-days: 3

  # No groups: the auto-merge workflow parses "from A to B" from each PR title.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 10
    # Matches `minimumReleaseAge` in bunfig.toml, which refuses versions
    # younger than 3 days; a shorter cooldown would open PRs that fail install.
    cooldown:
      default-days: 3
    # sanity-client-v8-hold:start
    # @sanity/client majors wait for next-sanity. An app-level v8 client next
    # to next-sanity's own v7 copy splits the TypeGen query types and every
    # typed query collapses to {}. .github/workflows/sanity-client-v8.yml opens
    # the v8 PR once next-sanity itself depends on v8, and that PR deletes
    # everything between these markers.
    ignore:
      - dependency-name: '@sanity/client'
        update-types: ['version-update:semver-major']
    # sanity-client-v8-hold:end
