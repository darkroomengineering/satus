name: Auto-merge Dependabot

# Auto-merge stable patch/minor Dependabot bumps once the CI workflow passes.
# Major, 0.x, prerelease and unrecognized updates require human review.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Check the PR author below; a maintainer can rerun Dependabot's CI.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Resolve Dependabot PR from head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          matches=$(gh api --paginate --slurp \
            "/repos/$REPO/commits/$HEAD_SHA/pulls?per_page=100" | \
            jq --arg sha "$HEAD_SHA" \
              '[.[][] | select(.state == "open" and .head.sha == $sha)]')
          count=$(echo "$matches" | jq 'length')
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one open PR for sha $HEAD_SHA; found $count."
            echo "Not auto-merging."
            exit 0
          fi

          if ! echo "$matches" | jq -e --arg repo "$REPO" \
            '.[0] | .user.login == "dependabot[bot]" and
              .head.repo.full_name == $repo and .base.repo.full_name == $repo and
              .base.ref == "main" and .draft == false' > /dev/null; then
            echo "PR must be a ready Dependabot PR from this repository to main."
            exit 0
          fi
          echo "number=$(echo "$matches" | jq -r '.[0].number')" >> "$GITHUB_OUTPUT"

      - name: Detect stable patch or minor bump from PR title
        id: update_type
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          title=$(gh pr view "$PR" --repo "$REPO" --json title --jq '.title')
          # Match a complete single-package title and full stable versions.
          # Unknown titles, grouped bumps, prereleases and 0.x stay manual.
          version='[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          transition=$(printf '%s\n' "$title" | grep -E \
            "^(chore\\(deps(-dev)?\\)|ci): [Bb]ump [@a-zA-Z0-9_./-]+ from $version to $version$" || true)
          if [ -z "$transition" ]; then
            echo "Title does not prove a stable single-package update; not auto-merging."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          from=$(echo "$transition" | awk '{print $(NF-2)}')
          to=$(echo "$transition" | awk '{print $NF}')
          if jq -en --arg from "$from" --arg to "$to" \
            '($from | split(".") | map(tonumber)) as $a |
              ($to | split(".") | map(tonumber)) as $b |
              $a[0] == $b[0] and $b > $a' > /dev/null; then
            echo "Stable patch/minor bump: $from -> $to. Eligible for auto-merge."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Major, unchanged or downgraded version: $from -> $to. Not auto-merging."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify latest CI run and squash merge
        if: >
          steps.pr.outputs.number != '' &&
          steps.update_type.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -o pipefail
          if ! gh api --paginate --slurp \
            "/repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" | \
            jq -e --arg sha "$HEAD_SHA" --argjson attempt "$RUN_ATTEMPT" \
              --argjson run "$RUN_ID" --argjson workflow "$WORKFLOW_ID" \
              '[.[].workflow_runs[] | select(.workflow_id == $workflow and
                .event == "pull_request" and .head_sha == $sha)] |
                max_by([.created_at, .id]) |
                .id == $run and .run_attempt == $attempt and
                .status == "completed" and .conclusion == "success"' > /dev/null; then
            echo "CI was superseded, rerun or is not successful; not auto-merging."
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"
