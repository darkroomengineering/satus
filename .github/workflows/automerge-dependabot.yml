name: Auto-merge Dependabot

# Auto-merge stable patch/minor Dependabot bumps once the CI workflow passes.
# Major, 0.x, prerelease and unrecognized updates require human review.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: darkroomengineering/.github/.github/workflows/dependabot-merge.yml@a75b42e03f56b5ca5b2808ac4f1b06c81998fbc6
    with:
      update-policy: stable-dependencies
