# Runs Lighthouse on Vercel previews and posts scores as commit comments
# (forwarded to Slack). Optional secrets:
#   VERCEL_TOKEN: without it the job skips with a warning.
#   VERCEL_AUTOMATION_BYPASS_SECRET: without it a protected preview 302s to
#     the SSO login page, so the audit is skipped instead of scoring that page.
#     It never reaches Lighthouse: the published report (LHR) copies request
#     settings, so a preflight trades it for a short-lived, deployment-scoped
#     bypass cookie and only the cookie goes to Lighthouse.

name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Discover Vercel Project
        id: vercel_info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Lighthouse reporting is optional infra: degrade gracefully (skip, not
          # fail) when the token is missing/invalid so PRs aren't blocked.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=Lighthouse skipped::VERCEL_TOKEN secret is not set. Add it in Settings → Secrets → Actions to enable Lighthouse reports."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          project_name="${GITHUB_REPOSITORY##*/}"
          echo "Looking for Vercel project: $project_name"

          # `[]?` tolerates a null/error response (e.g. invalid token) instead of crashing.
          teams=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams")
          team_id=$(echo "$teams" | jq -r '.teams[]? | select(.slug=="darkroom-engineering") | .id')

          projects=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?teamId=$team_id")
          project_id=$(echo "$projects" | jq -r ".projects[]? | select(.name==\"$project_name\") | .id")

          if [ -z "$team_id" ] || [ -z "$project_id" ]; then
            echo "::warning title=Lighthouse skipped::Could not resolve Vercel team/project (token invalid or lacks access). Skipping Lighthouse report."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Team ID: $team_id"
          echo "Project ID: $project_id"
          echo "team_id=$team_id" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Get Vercel Preview URL
        id: vercel_url
        if: steps.vercel_info.outputs.skip != 'true'
        uses: zentered/vercel-preview-url@fba568fc6d882ae788a9724d7e28dee618728771 # v1.4.0
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_team_id: ${{ steps.vercel_info.outputs.team_id }}
          vercel_project_id: ${{ steps.vercel_info.outputs.project_id }}

      - name: Wait for Deployment
        id: await
        if: steps.vercel_info.outputs.skip != 'true'
        uses: UnlyEd/github-action-await-vercel@dc8556d58bdb7f211f7b7af6052c29288c7419a4 # v2.0.0
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          deployment-url: ${{ steps.vercel_url.outputs.preview_url }}
          timeout: 300
          poll-interval: 10
        continue-on-error: true

      - name: Check Vercel Automation Bypass Secret
        id: bypass_check
        # Also require a non-empty preview URL: nothing to bypass-check without one.
        if: steps.vercel_info.outputs.skip != 'true' && steps.await.outcome == 'success' && steps.vercel_url.outputs.preview_url != ''
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Without it Lighthouse would score the SSO login page; skip loudly.
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::warning title=Lighthouse audit skipped::VERCEL_AUTOMATION_BYPASS_SECRET secret is not set. If this preview is behind Vercel Deployment Protection (the default for most teams), auditing it would score the SSO login page, not the app — so the audit is skipped rather than risk reporting fake numbers. Add VERCEL_AUTOMATION_BYPASS_SECRET in Settings → Secrets → Actions (value from Vercel → Project Settings → Deployment Protection → Protection Bypass for Automation) to enable the audit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Downstream steps gate on `== 'false'`, not `!= 'true'`: if this step
      # did not run its output is empty, and `!=` would run the audit steps
      # against a bare "https://".
      - name: Mint Vercel Bypass Cookie & Guard Against SSO Redirect
        id: bypass_cookie
        if: steps.bypass_check.outputs.skip == 'false'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_URL: ${{ steps.vercel_url.outputs.preview_url }}
        run: |
          # Mask the standing secret before anything below could echo it.
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"

          # `x-vercel-set-bypass-cookie: true` returns a deployment-scoped,
          # expiring cookie, safe to hand to Lighthouse. Read the name from the
          # jar (-c): it is undocumented and may change.
          cookie_jar="${RUNNER_TEMP}/vercel-bypass-cookies.txt"
          response=$(curl -sS -o /dev/null -w '%{http_code}|%{redirect_url}' \
            -c "$cookie_jar" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "x-vercel-set-bypass-cookie: true" \
            "https://$PREVIEW_URL")
          status_code="${response%%|*}"
          redirect_url="${response#*|}"

          echo "Preflight response: $status_code -> ${redirect_url:-<no redirect>}"

          # Fail loudly if the response still redirects to the SSO host.
          if [[ "$status_code" =~ ^3 ]] && [[ "$redirect_url" == *"vercel.com"* ]]; then
            echo "::error title=Lighthouse blocked by Deployment Protection::The preview URL still redirects to Vercel SSO ($redirect_url) even with the bypass header. Verify VERCEL_AUTOMATION_BYPASS_SECRET matches Vercel → Project Settings → Deployment Protection → Protection Bypass for Automation, and that Protection Bypass for Automation is enabled for this project."
            exit 1
          fi

          # The jar always has header lines, so a size check cannot detect a
          # missing cookie. Fields are tab-separated (domain flag path secure
          # expiry name value); HttpOnly cookies, which Vercel's bypass cookie
          # is, get a `#HttpOnly_` prefix on the domain field, so filter on
          # NF>=7 rather than a leading `#`.
          cookie_line=$(awk -F'\t' 'NF>=7' "$cookie_jar" | grep -i vercel | head -1 || true)
          if [ -z "$cookie_line" ]; then
            cookie_line=$(awk -F'\t' 'NF>=7' "$cookie_jar" | head -1 || true)
          fi
          cookie_name=$(printf '%s' "$cookie_line" | awk -F'\t' '{print $6}')
          cookie_value=$(printf '%s' "$cookie_line" | awk -F'\t' '{print $7}')

          if [ -z "$cookie_name" ] || [ -z "$cookie_value" ]; then
            echo "::error title=Lighthouse blocked by Deployment Protection::No bypass cookie came back from Vercel (status $status_code, no Set-Cookie) — the preview may not actually be Deployment Protection-guarded, or the bypass secret doesn't match. Check the response above."
            exit 1
          fi

          echo "::add-mask::$cookie_value"
          echo "Minted bypass cookie: $cookie_name=***"
          echo "cookie_name=$cookie_name" >> "$GITHUB_OUTPUT"
          echo "cookie_value=$cookie_value" >> "$GITHUB_OUTPUT"

      - name: Write Lighthouse Extra Headers Config
        id: lhci_config
        if: steps.bypass_check.outputs.skip == 'false'
        env:
          COOKIE_NAME: ${{ steps.bypass_cookie.outputs.cookie_name }}
          COOKIE_VALUE: ${{ steps.bypass_cookie.outputs.cookie_value }}
        run: |
          echo "::add-mask::$COOKIE_VALUE"

          # Only the bypass cookie, never the standing secret:
          # `extraHeaders` is copied verbatim into the published LHR.
          config_path="${RUNNER_TEMP}/lighthouserc.json"
          jq -n \
            --arg cookie "${COOKIE_NAME}=${COOKIE_VALUE}" \
            '{ ci: { collect: { settings: { extraHeaders: { "Cookie": $cookie } } } } }' \
            > "$config_path"
          echo "config_path=$config_path" >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse
        # An empty preview URL would audit bare "https://". Scores are advisory:
        # this reports them and never fails on them.
        if: steps.vercel_info.outputs.skip != 'true' && steps.await.outcome == 'success' && steps.vercel_url.outputs.preview_url != '' && steps.bypass_check.outputs.skip == 'false'
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        with:
          urls: https://${{ steps.vercel_url.outputs.preview_url }}
          # Average 3 runs to smooth out single-run cold-start variance (a cold
          # run can score 10-20 points below a warmed one).
          runs: 3
          configPath: ${{ steps.lhci_config.outputs.config_path }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Results
        id: format
        if: steps.vercel_info.outputs.skip != 'true' && steps.bypass_check.outputs.skip == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_FAILED: ${{ steps.await.outcome != 'success' }}
          PREVIEW_URL: ${{ steps.vercel_url.outputs.preview_url }}
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
          LINKS: ${{ steps.lighthouse.outputs.links }}
        with:
          script: |
            if (process.env.DEPLOYMENT_FAILED === 'true') {
              core.setOutput('comment', '⚠️ Vercel deployment failed or timed out. Lighthouse audit skipped.');
              return;
            }

            try {
              const manifest = JSON.parse(process.env.MANIFEST);
              const links = JSON.parse(process.env.LINKS);
              const previewUrl = process.env.PREVIEW_URL;

              const scores = manifest[0].summary;
              const reportUrl = Object.values(links)[0];

              const emoji = (score) => score >= 0.9 ? '🟢' : score >= 0.5 ? '🟠' : '🔴';
              const format = (score) => Math.round(score * 100);

              const comment = [
                `⚡️ [Lighthouse report](${reportUrl}) for this commit:`,
                '',
                `${emoji(scores.performance)} Performance: ${format(scores.performance)}`,
                `${emoji(scores.accessibility)} Accessibility: ${format(scores.accessibility)}`,
                `${emoji(scores['best-practices'])} Best Practices: ${format(scores['best-practices'])}`,
                `${emoji(scores.seo)} SEO: ${format(scores.seo)}`,
                '',
                `*Tested on [${previewUrl}](https://${previewUrl})*`
              ].join('\n');

              core.setOutput('comment', comment);
            } catch (error) {
              console.error('Error:', error);
              core.setOutput('comment', '⚠️ Failed to generate Lighthouse report. Check workflow logs.');
            }

      - name: Post Commit Comment
        if: steps.vercel_info.outputs.skip != 'true' && steps.bypass_check.outputs.skip == 'false' && steps.format.outputs.comment != ''
        uses: peter-evans/commit-comment@f6d60c65d05bb59f750fa51ad3de1d443ba0eb52 # v4
        with:
          body: ${{ steps.format.outputs.comment }}
