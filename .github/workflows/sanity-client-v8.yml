name: Sanity client v8 watch

# Opens the @sanity/client v8 upgrade PR once next-sanity itself depends on
# v8. Until then Dependabot ignores @sanity/client majors (see
# .github/dependabot.yml): a v8 app client next to next-sanity's own v7 copy
# splits the TypeGen query types and breaks every typed query.
#
# The PR it opens removes the Dependabot hold. It cannot delete this file,
# because a GITHUB_TOKEN push may not change workflows, so delete it when
# merging that PR. Cost of leaving it: one no-op weekly run, since it exits
# once package.json is on v8. It also stays quiet after a human closes its PR.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sanity-client-v8
  cancel-in-progress: false

env:
  BRANCH: deps/sanity-client-v8

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Check whether next-sanity depends on v8
        id: check
        run: |
          set -euo pipefail
          read_dep() { bun -p "require('./package.json').dependencies?.['$1'] ?? ''"; }
          major() { grep -oE '[0-9]+' <<<"$1" | head -1; }
          ours=$(read_dep '@sanity/client')
          if [ -z "$ours" ] || [ -z "$(read_dep next-sanity)" ]; then
            echo "Sanity is not installed in this project."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(major "$ours")" -ge 8 ]; then
            echo "Already on $ours."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          theirs=$(bun -p "(await (await fetch('https://registry.npmjs.org/next-sanity/latest')).json()).dependencies?.['@sanity/client'] ?? ''")
          echo "next-sanity@latest depends on @sanity/client $theirs"
          if [ "$(major "$theirs")" -lt 8 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(gh pr list --head "$BRANCH" --state all --json number --jq length)" -gt 0 ]; then
            echo "An upgrade PR already exists or was closed."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Open the upgrade PR
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          bun add --ignore-scripts '@sanity/client@^8' next-sanity@latest
          sed -i '/# sanity-client-v8-hold:start/,/# sanity-client-v8-hold:end/d' .github/dependabot.yml
          version=$(bun -p "require('./node_modules/next-sanity/package.json').version")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(deps): bump @sanity/client to v8 with next-sanity $version"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): bump @sanity/client to v8 with next-sanity $version" \
            --body "next-sanity $version depends on @sanity/client v8, so the app client can follow it.

          - Bumps \`@sanity/client\` to ^8 and \`next-sanity\` to $version.
          - Removes the Dependabot hold on @sanity/client majors.

          Before merging:
          - [ ] Delete \`.github/workflows/sanity-client-v8.yml\` in this PR (the bot cannot change workflow files).
          - [ ] Run \`bun run check\` after a clean install and confirm TypeGen query types still resolve.
          - [ ] Note the upgrade in CHANGELOG.md."
          gh workflow run ci.yml --ref "$BRANCH"
