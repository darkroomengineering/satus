# Next loads env files itself, through @dotenvx/next-env, which decrypts them.
# Bun's own loader would set the still-encrypted values first, and Next never
# overwrites a variable that is already set.
env = false

[test]
preload = ["./lib/scripts/test-setup.ts"]

[install]
# Install only package versions published at least 3 days ago (259200 s).
# A compromised release is usually pulled within hours, so this keeps one out
# of the lockfile. Dependabot's `cooldown` in .github/dependabot.yml matches
# it, so version-update PRs never ask for a version Bun would refuse.
# Cost: Dependabot security updates ignore the cooldown, so a fix published
# less than 3 days ago fails `bun install`; add that package to
# `minimumReleaseAgeExcludes` until it ages past the window, then remove it.
minimumReleaseAge = 259200
# SHORTCUT: oxlint and @oxlint/plugins 1.92.0 published 2026-11-06T12:29Z; 1.91.0 has a react/immutability false positive (oxc-project/oxc#28401). ceiling: skips the age guard for oxlint, its plugin package and its 19 native binding packages, all lint-only dev dependencies. upgrade: remove after 2026-11-09T12:29Z (OSS-150).
minimumReleaseAgeExcludes = [
  "oxlint",
  "@oxlint/plugins",
  "@oxlint/binding-android-arm-eabi",
  "@oxlint/binding-android-arm64",
  "@oxlint/binding-darwin-arm64",
  "@oxlint/binding-darwin-x64",
  "@oxlint/binding-freebsd-x64",
  "@oxlint/binding-linux-arm-gnueabihf",
  "@oxlint/binding-linux-arm-musleabihf",
  "@oxlint/binding-linux-arm64-gnu",
  "@oxlint/binding-linux-arm64-musl",
  "@oxlint/binding-linux-ppc64-gnu",
  "@oxlint/binding-linux-riscv64-gnu",
  "@oxlint/binding-linux-riscv64-musl",
  "@oxlint/binding-linux-s390x-gnu",
  "@oxlint/binding-linux-x64-gnu",
  "@oxlint/binding-linux-x64-musl",
  "@oxlint/binding-openharmony-arm64",
  "@oxlint/binding-win32-arm64-msvc",
  "@oxlint/binding-win32-ia32-msvc",
  "@oxlint/binding-win32-x64-msvc",
]
