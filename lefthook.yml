# Lefthook configuration for git hooks
# Cross-platform compatible (Windows, macOS, Linux)
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # Format then lint, sequentially inside ONE command, so the two binaries
    # never write the same file concurrently. --no-error-on-unmatched-pattern
    # is required: oxlint exits 1 on a docs- or CSS-only commit, where none of
    # the staged files are JS/TS for it to lint.
    # --type-aware is deliberately absent; it runs in `bun run check` and CI so
    # that commits stay fast.
    oxc:
      glob: '*.{js,mjs,cjs,ts,tsx,jsx,css,json,jsonc,md,yml,yaml,toml}'
      run: bun oxfmt --no-error-on-unmatched-pattern {staged_files} && bun oxlint --fix --max-warnings=0 --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      # TS7 native (single `typescript@^7` package; Next 16.3 shells out to
      # the TS CLI itself, so no classic JS-API copy is needed). Incremental
      # is on: typescript is the only writer of tsconfig.tsbuildinfo, and the
      # warm cache is ~4x faster.
      run: bun node_modules/typescript/bin/tsc --noEmit
      stage_fixed: false

# Build stays CI-only (too slow for a local pre-push gate). Tests (~4s) and
# the manifest check (~1s) are cheap enough to run here, so a push can't land
# with a broken suite or a stale COMPONENTS.md.
pre-push:
  commands:
    test-and-manifest:
      run: bun test && bun run manifest:check
      skip:
        - merge
        - rebase

# Branch switches leave the previous branch's generated route types in
# .next/types (tsconfig includes them), producing ghost tsc errors about
# routes that don't exist on the new branch. Clear them on real branch
# checkouts only — {3} is git's flag: 1 = branch switch, 0 = file checkout.
# They regenerate on the next `bun dev` / `bun run build`.
post-checkout:
  commands:
    clear-generated-types:
      skip:
        - rebase
      run: '[ "{3}" != "1" ] || rm -rf .next/types .next/dev/types'

post-merge:
  commands:
    install-deps:
      run: bun i
